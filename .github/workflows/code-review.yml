name: Automated Code Review

on:
  pull_request:
    branches:
      - main # ← default branch ONLY

permissions:
  contents: read
  pull-requests: write # REQUIRED for PR comments

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review tools
        run: |
          pip install ruff bandit reviewdog yamllint

      # --------------------
      # PYTHON CODE REVIEW
      # --------------------
      - name: Python lint & improvement suggestions (Ruff)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: NONE
        run: |
          ruff check . \
            --output-format=rdjson \
          | reviewdog \
            -f=rdjson \
            -name="Python Best Practices (Ruff)" \
            -reporter=github-pr-review \
            -level=warning

      # --------------------
      # PYTHON SECURITY REVIEW
      # --------------------
      - name: Python security suggestions (Bandit)
        env:
          REVIEWDOG_GITHUB_API_TOKEN: NONE
        run: |
          bandit -r . -f json \
          | reviewdog \
            -f=bandit \
            -name="Security Improvements (Bandit)" \
            -reporter=github-pr-review \
            -level=warning

      # --------------------
      # YAML CODE REVIEW
      # --------------------
      - name: YAML best practices review
        env:
          REVIEWDOG_GITHUB_API_TOKEN: NONE
        run: |
          yamllint -f parsable . \
          | reviewdog \
            -f=yamllint \
            -name="YAML Improvements" \
            -reporter=github-pr-review \
            -level=warning
